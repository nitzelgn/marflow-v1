<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ════════════════════════════════════════════
       MARFLOW · Brand mark
       Fondo navy + ola gold + punto/sol gold
       Simbolismo: inicio (Nuevo) → flujo (seguimiento) → cierre (meta)
       ════════════════════════════════════════════ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2654"/>
      <stop offset="1" stop-color="#0A1F44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8985A"/>
      <stop offset=".55" stop-color="#D4B576"/>
      <stop offset="1" stop-color="#C6A96B"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F0D89A" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#C6A96B" stop-opacity=".18"/>
      <stop offset="1" stop-color="#C6A96B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo navy con esquinas redondeadas (estilo iOS app icon) -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Halo sutil del sol -->
  <circle cx="372" cy="168" r="86" fill="url(#dotGlow)"/>

  <!-- Ola principal: curvas suaves de izq→der subiendo al cierre -->
  <path
    d="M 64 312
       C 120 312, 144 252, 200 252
       S 280 312, 336 296
       S 416 232, 448 220"
    fill="none"
    stroke="url(#gold)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Ola secundaria, más sutil, refuerza el "flujo constante" -->
  <path
    d="M 88 360
       C 152 360, 184 320, 240 320
       S 312 360, 368 348"
    fill="none"
    stroke="url(#gold)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity=".5"/>

  <!-- Punto/sol gold (meta · cierre) -->
  <circle cx="372" cy="168" r="34" fill="url(#gold)"/>
  <circle cx="364" cy="160" r="10" fill="#F5E4BD" opacity=".75"/>
</svg>
